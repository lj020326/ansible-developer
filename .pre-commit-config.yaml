---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  autoupdate_schedule: quarterly
#  skip:
#    - local-ansible-lint

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(ldif|schema)(\.j2)?$
      - id: end-of-file-fixer
        exclude: \.(ldif|schema)(\.j2)?$
      - id: check-json
        files: ^(files|tests)/
        exclude: files/env/dev/vscode
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
        files: ^(files|tests)/
        exclude: |
          (?x)^(
            (.*/)?archive/|
            files/private/|
            files/scripts/apache-utils/docker/|
            files/scripts/ansible/vault_scrambler\.py|
            files/scripts/ansible/tests/unit/test_vault_scrambler\.py|
            files/scripts/python/tests/unit/test_redact\.py
          )
      - id: mixed-line-ending
        files: ^(files|tests)/
        exclude: \.(ldif|schema)(\.j2)?$

  - repo: local
    hooks:
      - id: clean-test-build-files
        name: clean up test and build files
        entry: >-
          bash -c '
          find . -type f \( -name ".package_dir.*.yml" \
            -o -name "*.pyc" -o -name "*.pyo" \) -delete;
          find . -type d \( -name "__pycache__" \
            -o -name ".pytest_cache" -o -name ".tox" \
            -o -name "build" -o -name "dist" -o -name "*.egg-info" \) \
            -exec rm -rf {} + 2>/dev/null || true
          '
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: Check Shell Scripts (shellcheck)
        args: [-x]
#        files: ^(files|tests)/
#        files: ^files/scripts/(ansible|python)/
        files: ^files/scripts/
        types: [shell]
#        exclude: "**/archive/"
        exclude: |
          (?x)(
            (.*/)?archive/|
            ^files/private/|
            ^files/scripts/apache-utils/docker/
          )
