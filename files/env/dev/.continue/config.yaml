name: Global Config
version: 1.0.0
schema: v1

models:
  - name: "Qwen3-Coder 30B (Main)"
    provider: ollama
    model: qwen3-coder:30b
    apiBase: "${OLLAMA_API_URL}"
    roles:
      - chat
      - edit
      - apply
    requestOptions:
      headers:
        Authorization: "Basic ${OLLAMA_API_KEY}"

#  - name: "Qwen 3.5 27B"
