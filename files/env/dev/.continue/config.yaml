  - name: "Devstral 24B"
    provider: ollama
    model: devstral:24b
    apiBase: "${OLLAMA_API_URL}"
    roles:
      - chat
      - edit
    requestOptions:
      headers:
        Authorization: "Basic ${OLLAMA_API_KEY}"

  - name: "Nomic Embed Text"
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: "${OLLAMA_API_URL}"
    roles:
      - embed
    requestOptions:
      headers:
        Authorization: "Basic ${OLLAMA_API_KEY}"

